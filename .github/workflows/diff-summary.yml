name: Code Diff Summary

on:
  push:
    branches: [ "main" ]

jobs:
  summarize-and-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug Git Info
        run: |
          echo "SHA: ${{ github.sha }}"
          echo "BEFORE: ${{ github.event.before }}"
          git log --oneline -n 5

      - name: Extract changed files
        run: |
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} > files.txt
          cat files.txt || echo "No files"

      - name: Extract full diff
        run: |
          git diff ${{ github.event.before }} ${{ github.sha }} > diff.txt
          head -n 50 diff.txt || echo "No diff"

      # ✅ מה שביקשת – התקנת requests
      - name: Install dependencies
        run: pip install requests

      - name: Generate summary using Python
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 -c "
import os
import requests

def read_file(path):
    try:
        return open(path, 'r', encoding='utf-8').read()
    except:
        return ''

diff = read_file('diff.txt')
files = read_file('files.txt')

if not diff.strip():
    summary = 'No changes detected.'
else:
    prompt = f'''You are a senior software engineer.

Analyze the following git changes.

Return:
1. Summary
2. Feature / bug fix description
3. Files changed and why
4. Risks
5. Suggested tests

Changed files:
{files}

Diff:
{diff[:12000]}'''

    response = requests.post(
        'https://api.openai.com/v1/chat/completions',
        headers={
            'Authorization': 'Bearer ' + os.environ.get('OPENAI_API_KEY',''),
            'Content-Type': 'application/json'
        },
        json={
            'model': 'gpt-4.1-mini',
            'messages': [
                {'role': 'system', 'content': 'You summarize code changes.'},
                {'role': 'user', 'content': prompt}
            ]
        }
    )

    print('STATUS:', response.status_code)
    print('RESPONSE:', response.text)

    try:
        summary = response.json()['choices'][0]['message']['content']
    except:
        summary = 'Failed to parse OpenAI response.'

open('summary.txt', 'w', encoding='utf-8').write(summary)
"

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Code Diff Summary - ${{ github.repository }}"
          to: ommarmor@gmail.com
          from: GitHub Bot
          secure: true
          body: file://summary.txt

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            diff.txt
            files.txt
            summary.txt