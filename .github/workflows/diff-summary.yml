name: Code Diff Summary

on:
  push:
    branches: [ "main" ]

jobs:
  summarize-and-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug Git Info
        run: |
          echo "SHA: ${{ github.sha }}"
          echo "BEFORE: ${{ github.event.before }}"
          git log --oneline -n 5

      - name: Extract changed files
        run: |
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} > files.txt
          cat files.txt || echo "No files"

      - name: Extract full diff
        run: |
          git diff ${{ github.event.before }} ${{ github.sha }} > diff.txt
          head -n 50 diff.txt || echo "No diff"

      - name: Install Python dependencies
        run: pip install requests

      - name: Run summary script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 script.py

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Code Diff Summary - ${{ github.repository }}"
          to: ommarmor@gmail.com
          from: GitHub Bot
          secure: true
          body: file://summary.txt

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            diff.txt
            files.txt
            summary.txt